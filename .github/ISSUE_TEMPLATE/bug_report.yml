name: Bug report
description: Something doesn't work as documented
labels: ['bug']
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - verbaly (core)
        - '@verbaly/compiler'
        - '@verbaly/vite'
        - '@verbaly/unplugin'
        - '@verbaly/react'
        - '@verbaly/vue'
        - '@verbaly/svelte'
        - '@verbaly/sveltekit'
        - '@verbaly/nuxt'
        - '@verbaly/next'
        - '@verbaly/astro'
        - '@verbaly/mcp'
        - '@verbaly/studio'
        - not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The thirteen packages share one number, so any of them answers this.
      placeholder: '0.x.y'
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A minimal snippet or repo link. The message/catalog + the call that misbehaves is usually enough.
      placeholder: |
        const v = createVerbaly({ ... });
        v.t('key'); // expected X, got Y
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: 'Node 22 / Vite 8 / browser / SSR…'
