name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# the default token is read-write on everything; CI only ever reads the code it checks out
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # both LTS lines people run: the suite has to hold on each, not only on the one CI picked
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # reads packageManager from package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build # topological: core → compiler → vite/adapters

      # what does not change with the runtime runs once
      - run: pnpm --filter verbaly size # pillar 2 gate: core gzip budgets
        if: matrix.node == 22

      - run: pnpm typecheck
        if: matrix.node == 22

      - run: pnpm lint
        if: matrix.node == 22

      - run: pnpm format:check
        if: matrix.node == 22

      # the same command (and parallelism) the Release runs: twice a release was blocked by a
      # timeout flake that only shows here, and only the manual ritual caught it
      - run: pnpm test

      - run: pnpm coverage # full test suite + lcov report
        if: matrix.node == 22

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.node == 22
        with:
          files: coverage/lcov.info

  # the suite alone: native tree watching and Windows paths take branches Ubuntu never runs
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    # pwsh's pnpm.ps1 starts pnpm 12's extensionless binary without waiting: steps passed empty
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # reads packageManager from package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test
