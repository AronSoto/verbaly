name: CodeQL

# The repo already scanned with CodeQL's default setup, which has no workflow file, so Scorecard's
# SAST check could not see it and read 0. The analysis is the same either way: what this file buys
# is a configuration pinned by commit and readable in git, plus that check.
# The two modes are mutually exclusive and the first push proved it: leaving both on fails the
# upload with "analyses from advanced configurations cannot be processed when the default setup is
# enabled", so default setup has to stay off for this to work.
# Findings land in the Security tab. Dependabot updates the pins.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    - cron: '31 5 * * 1'

permissions: read-all

jobs:
  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the findings to the Security tab
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # no build step: CodeQL reads TypeScript sources directly for this language
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
