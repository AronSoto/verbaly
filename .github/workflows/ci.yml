name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # reads packageManager from package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build # topological: core → compiler → vite/adapters

      - run: pnpm --filter verbaly size # pillar 2 gate: core gzip budgets

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm coverage # full test suite + lcov report

      - uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
