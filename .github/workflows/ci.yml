name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# the default token is read-write on everything; CI only ever reads the code it checks out
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # reads packageManager from package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build # topological: core → compiler → vite/adapters

      - run: pnpm --filter verbaly size # pillar 2 gate: core gzip budgets

      - run: pnpm typecheck

      - run: pnpm lint

      # the same command (and parallelism) the Release runs: twice a release was blocked by a
      # timeout flake that only shows here, and only the manual ritual caught it
      - run: pnpm test

      - run: pnpm coverage # full test suite + lcov report

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/lcov.info
