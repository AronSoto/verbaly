# Automatic release: every push to develop whose packages/core version has no
# vX.Y.Z tag yet publishes every packages/* package to npm with provenance (OIDC) and
# creates the GitHub Release with a short body: the entry's theme line +
# Highlights section, plus a link to the full changelog in the repo.
# No version bump in the push → tag already exists → the run no-ops.
# workflow_dispatch re-runs the release for the current version (e.g. after a failure).
# Auth: npm Trusted Publishing (configured per package on npmjs.com); no token needed.
name: Release

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write # create the vX.Y.Z tag + GitHub Release
  id-token: write # OIDC for npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect version — skip when v<version> is already tagged
        id: version
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already released — nothing to do"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "releasing v$VERSION"
          fi

      - uses: pnpm/action-setup@v6 # reads packageManager from package.json
        if: steps.version.outputs.new == 'true'

      - uses: actions/setup-node@v6
        if: steps.version.outputs.new == 'true'
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - if: steps.version.outputs.new == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.version.outputs.new == 'true'
        run: pnpm build

      - if: steps.version.outputs.new == 'true'
        run: pnpm test

      - if: steps.version.outputs.new == 'true'
        run: pnpm typecheck

      - if: steps.version.outputs.new == 'true'
        run: pnpm lint

      - name: Publish with provenance (skipped if the version is already on npm)
        if: steps.version.outputs.new == 'true'
        run: |
          V="${{ steps.version.outputs.version }}"
          # per-package resume: tolerates partial runs and manual first publishes
          # (a brand-new package can't have a Trusted Publisher until it exists on npm)
          for dir in packages/*; do
            NAME=$(node -p "require('./$dir/package.json').name")
            if npm view "$NAME@$V" version > /dev/null 2>&1; then
              echo "$NAME@$V already on npm — skipping"
            else
              pnpm --filter "$NAME" publish --access public --no-git-checks --provenance
            fi
          done

      - name: Create the GitHub Release from the changelog entry
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          # Body = theme paragraph + Highlights only (skip the "## [x.y.z]" header;
          # stop at the first section that isn't Highlights).
          awk -v ver="$V" '
            index($0, "## [" ver "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^### / && $0 !~ /^### Highlights/ { exit }
            on { print }
          ' changelog/CHANGELOG.md > /tmp/release-notes.md
          if ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
            echo "No changelog entry found for $V — add it (with a Highlights section) to changelog/CHANGELOG.md" >&2
            exit 1
          fi
          {
            echo ""
            echo "---"
            echo "_For the full details of this release, see the [repository changelog](https://github.com/AronSoto/verbaly/blob/develop/changelog/CHANGELOG.md)._"
          } >> /tmp/release-notes.md
          gh release create "v$V" --title "Release v$V" \
            --notes-file /tmp/release-notes.md --target "$GITHUB_SHA"
