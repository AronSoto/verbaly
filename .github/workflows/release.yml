name: Release

# Automatic release: every push to develop whose packages/core version has no
# vX.Y.Z tag yet publishes every packages/* package to npm with provenance (OIDC) and
# creates the GitHub Release with a short body: the entry's theme line +
# Highlights section, plus a link to the full changelog in the repo.
# No version bump in the push → tag already exists → the run no-ops.
# workflow_dispatch re-runs the release for the current version (e.g. after a failure).
# Auth: npm Trusted Publishing (configured per package on npmjs.com); no token needed.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the vX.Y.Z tag + GitHub Release
      id-token: write # OIDC for npm provenance
    outputs:
      # mcp-registry waits for npm only when this run is the one that published
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect version, skipped when v<version> is already tagged
        id: version
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already released, nothing to do"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "releasing v$VERSION"
          fi

      # reads packageManager from package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.version.outputs.new == 'true'

      # v7 stopped exporting a dummy NODE_AUTH_TOKEN, which is the shape its own OIDC docs recommend
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.version.outputs.new == 'true'
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - if: steps.version.outputs.new == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.version.outputs.new == 'true'
        run: pnpm build

      - if: steps.version.outputs.new == 'true'
        run: pnpm --filter verbaly size

      - if: steps.version.outputs.new == 'true'
        run: pnpm test

      - if: steps.version.outputs.new == 'true'
        run: pnpm typecheck

      - if: steps.version.outputs.new == 'true'
        run: pnpm lint

      - name: Publish with provenance (skipped if the version is already on npm)
        if: steps.version.outputs.new == 'true'
        run: |
          V="${{ steps.version.outputs.version }}"
          FAILED=""
          # per-package resume: tolerates partial runs and manual first publishes
          # (a brand-new package can't have a Trusted Publisher until it exists on npm)
          for dir in packages/*; do
            NAME=$(node -p "require('./$dir/package.json').name")
            if [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ]; then
              echo "$NAME is private, skipping"
            elif npm view "$NAME@$V" version > /dev/null 2>&1; then
              echo "$NAME@$V already on npm, skipping"
            elif ! pnpm --filter "$NAME" publish --access public --no-git-checks --provenance; then
              # one package without a Trusted Publisher must not strand the ones after it
              FAILED="$FAILED $NAME"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "::error::failed to publish:$FAILED (a brand-new package needs one manual publish, then a Trusted Publisher, then re-run this workflow)"
            exit 1
          fi

      - name: Create the GitHub Release from the changelog entry
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          # Body = theme paragraph + Highlights only (skip the "## [x.y.z]" header;
          # stop at the first section that isn't Highlights).
          awk -v ver="$V" '
            index($0, "## [" ver "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^### / && $0 !~ /^### Highlights/ { exit }
            on { print }
          ' changelog/CHANGELOG.md > /tmp/release-notes.md
          if ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
            echo "No changelog entry found for $V: add it (with a Highlights section) to changelog/CHANGELOG.md" >&2
            exit 1
          fi
          {
            echo ""
            echo "---"
            echo "_For the full details of this release, see the [repository changelog](https://github.com/AronSoto/verbaly/blob/develop/changelog/CHANGELOG.md)._"
          } >> /tmp/release-notes.md
          gh release create "v$V" --title "Release v$V" \
            --notes-file /tmp/release-notes.md --target "$GITHUB_SHA"

  # @verbaly/mcp in the official MCP Registry (packages/mcp/server.json), logged in through OIDC:
  # no token. It runs on every push and lists only a version npm has and the registry lacks, so a
  # version released before this job existed goes out on the next push.
  mcp-registry:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: the registry's login for io.github.AronSoto/*
    env:
      # pinned on purpose, never releases/latest: the binary is checked against its sigstore bundle
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide whether this version still has to be listed
        id: check
        env:
          PUBLISHED_HERE: ${{ needs.release.outputs.new }}
        run: |
          cd packages/mcp
          V=$(node -p "require('./server.json').version")
          NAME=$(node -p "encodeURIComponent(require('./server.json').name)")
          on_npm() { npm view "@verbaly/mcp@$V" version > /dev/null 2>&1; }
          # npm is not read-after-write: a version published minutes ago may not show yet (0.78.0)
          if [ "$PUBLISHED_HERE" = "true" ] && ! on_npm; then
            for attempt in $(seq 1 30); do
              echo "waiting for npm to show @verbaly/mcp@$V ($attempt of 30)"
              sleep 20
              if on_npm; then break; fi
            done
          fi
          if ! on_npm; then
            if [ "$PUBLISHED_HERE" = "true" ]; then
              echo "::warning::@verbaly/mcp@$V still not on npm after 10 minutes: the next push lists it"
            fi
            echo "@verbaly/mcp@$V is not on npm, so the registry has nothing to point at"
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0.1/servers/$NAME/versions/$V")" = "200" ]; then
            echo "$V is already in the registry"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "listing $V"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.check.outputs.go == 'true'

      - name: Download mcp-publisher and verify it
        if: steps.check.outputs.go == 'true'
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: List the version in the MCP Registry
        if: steps.check.outputs.go == 'true'
        working-directory: packages/mcp
        run: |
          ../../mcp-publisher login github-oidc
          ../../mcp-publisher publish
